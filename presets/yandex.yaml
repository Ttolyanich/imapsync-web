id: yandex
name: Яндекс Почта
icon: yandex.svg
verified: false

roles: [source, destination]

host: imap.yandex.ru
port: 993
security: ssl
verify_cert: true

# Админского прохода к чужим ящикам по IMAP нет: нужен пароль приложения
# от каждого ящика.
auth_mode: password

max_parallel: 3

folders:
  inbox: INBOX
  sent: Отправленные
  drafts: Черновики
  trash: Удалённые
  junk: Спам
  archive: Архив

hints:
  - "Нужен пароль приложения, обычный пароль от аккаунта не подойдёт."
  - "Пароль приложения выдаётся только при включённой двухфакторной аутентификации,
     и сделать это должен сам владелец ящика — заложи на организационную часть
     больше времени, чем на техническую."
  - "В настройках почты должен быть включён доступ по протоколу IMAP."
  - "Папка удалённых называется «Удалённые» (не «Корзина») — если сервер не
     объявит SPECIAL-USE, соответствие возьмётся из этого пресета."
  - "Ограничения на число подключений действуют на IP-адрес: за корпоративным
     NAT агрессивная параллельность задевает весь офис."

imapsync_args: []
