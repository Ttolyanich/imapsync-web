# Словарь для опознания спецпапок по имени.
#
# Используется ТОЛЬКО как запасной вариант: сначала мы спрашиваем у сервера
# флаги SPECIAL-USE (RFC 6154), и лишь если сервер их не объявляет — смотрим сюда.
#
# Смысл: привести папку к «роли» (inbox/sent/drafts/trash/junk/archive),
# чтобы потом взять каноническое имя этой роли из пресета приёмника.
# Именно это не даёт получить на приёмнике одновременно и "Sent Items",
# и "Отправленные" с размазанными по ним письмами.
#
# Сравнение регистронезависимое, пробелы по краям обрезаются.
# Добавить свой язык или свой сервер — просто дописать строку сюда.

version: 1

roles:
  inbox:
    - INBOX
    - Входящие
    - Inbox

  sent:
    - Sent
    - Sent Items
    - Sent Messages
    - Sent Mail
    - Отправленные
    - Отправленная почта
    - Исходящие
    - "[Gmail]/Sent Mail"
    - "[Gmail]/Отправленные"
    - "&BB4EQgQ,BEAEMAQyBDsENQQ9BD0ESwQ1-"   # Отправленные в modified UTF-7

  drafts:
    - Drafts
    - Черновики
    - "[Gmail]/Drafts"
    - "[Gmail]/Черновики"
    - "&BCcENQRABD0EPgQyBDgEOgQ4-"

  trash:
    - Trash
    - Deleted Items
    - Deleted Messages
    - Корзина
    - Удаленные
    - Удалённые
    - "[Gmail]/Trash"
    - "[Gmail]/Корзина"
    - "&BBoEPgRABDcEOAQ9BDA-"

  junk:
    - Junk
    - Junk E-mail
    - Junk Email
    - Bulk Mail
    - Spam
    - Спам
    - "[Gmail]/Spam"
    - "[Gmail]/Спам"
    - "&BCEEPwQwBDw-"

  archive:
    # У Gmail «Вся почта» — это не архив, а весь ящик целиком: письмо видно
    # и там, и в своём ярлыке. Переносить её вместе с ярлыками — значит
    # раздуть объём в разы, поэтому по умолчанию она попадает в исключения.
    - Archive
    - Archives
    - Архив
    - "[Gmail]/All Mail"
    - "[Gmail]/Вся почта"
    - "&BBAEQATFBDgEMg-"

# Папки, которые не переносим никогда: это не почта пользователя.
never_migrate:
  - Outbox
  - Исходящие (Outbox)
  - Calendar
  - Contacts
  - Tasks
  - Notes
  - Journal
  - Sync Issues
  - Conversation History
  - RSS Feeds
