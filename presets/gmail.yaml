id: gmail
name: Gmail / Google Workspace
icon: gmail.svg
verified: false

# Как приёмник Gmail тоже возможен, но у Google есть собственный мигратор,
# и для переезда В Google он обычно удобнее.
roles: [source, destination]

host: imap.gmail.com
port: 993
security: ssl
verify_cert: true
auth_mode: password

# У Gmail заметные ограничения на объём выгрузки в сутки, поэтому осторожно.
max_parallel: 2

folders:
  inbox: INBOX
  sent: "[Gmail]/Отправленные"
  drafts: "[Gmail]/Черновики"
  trash: "[Gmail]/Корзина"
  junk: "[Gmail]/Спам"
  archive: "[Gmail]/Вся почта"

hints:
  - "Нужен пароль приложения (App password) при включённой двухфакторной
     аутентификации, либо OAuth2 — последний в этой панели пока не поддержан."
  - "В настройках почты должен быть включён доступ по IMAP."
  - "Главная особенность: письмо в Gmail физически одно, а видно и в ярлыке,
     и во «Всей почте». Наивный обход папок раздувает объём в разы — папку
     «Вся почта» имеет смысл исключить из переноса."
  - "Имена системных папок зависят от языка интерфейса аккаунта: у англоязычного
     это [Gmail]/Sent Mail и подобные. Проверь на экране сопоставления папок."
  - "У Google есть суточные лимиты на объём выгрузки: на больших ящиках прогон
     может упереться в них и продолжиться на следующий день."

imapsync_args: []
