id: exchange-onprem
name: Exchange (локальный)
icon: exchange.svg
verified: false

roles: [source, destination]

# Адрес сервера у каждого свой — подставится в форму как заготовка.
host: ""
port: 993
security: ssl
# В локальных установках часто самоподписанный сертификат. Оставляем проверку
# включённой по умолчанию: выключать её должно быть осознанным действием.
verify_cert: true

# У Exchange нет мастер-пользователя, как у Dovecot или Zimbra: зайти в чужой
# ящик по IMAP с админским паролем нельзя. Нужен пароль от каждого ящика.
# Обычно они известны — ящики заводит тот же администратор.
auth_mode: password

max_parallel: 5

folders:
  inbox: INBOX
  sent: Sent Items
  drafts: Drafts
  trash: Deleted Items
  junk: Junk Email
  archive: Archive

# Подсказки берём в кавычки: двоеточие внутри обычной строки YAML принимает
# за начало вложенного ключа и файл перестаёт читаться.
hints:
  - "Служба «Microsoft Exchange IMAP4» по умолчанию выключена — включить нужно
     и её, и IMAP4 Backend, иначе подключения просто не будет."
  - "Мастер-пароль не поддерживается: пароль нужен от каждого ящика отдельно."
  - "Общие ящики (shared mailbox) привязаны к отключённой учётной записи, прямой
     IMAP-логин в них не работает — нужен вход через пользователя с полными правами."
  - "Проверь политику хранения на приёмнике: правило «удалять письма старше N лет»
     может съесть только что перенесённый архив уже на следующие сутки."
  - "Политика троттлинга может обрывать активную IMAP-сессию — для миграционных
     учётных записей обычно делают послабление."
  - "Календари, контакты, задачи и правила по IMAP не переносятся — только почта."

imapsync_args: []
