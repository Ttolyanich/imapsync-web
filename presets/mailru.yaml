id: mailru
name: Mail.ru
icon: mailru.svg
# Пресет не проверялся на живом сервере — в интерфейсе показывается со значком.
# Проверил и работает? Поправь на true пул-реквестом.
verified: false

# Где этот сервер может выступать.
roles: [source, destination]

host: imap.mail.ru
port: 993
security: ssl
verify_cert: true

# Mail.ru не даёт админского прохода к чужим ящикам по IMAP:
# пароль нужен от каждого ящика, и это пароль приложения.
auth_mode: password

# Консервативно: троттлинг Mail.ru срабатывает на IP-адрес, а за корпоративным
# NAT это IP всего офиса. Поднимать осознанно и по факту, а не «чтобы быстрее».
max_parallel: 3

# Канонические имена спецпапок на этом сервере — используются, когда Mail.ru
# выступает приёмником.
folders:
  inbox: INBOX
  sent: Отправленные
  drafts: Черновики
  trash: Корзина
  junk: Спам
  archive: Архив

hints:
  - "Нужен пароль приложения, обычный пароль от ящика не подойдёт."
  - "Пароль приложения выдаётся только при включённой двухфакторной аутентификации —
     это придётся сделать каждому пользователю самому, заложи на это время."
  - "В настройках ящика должен быть включён доступ по IMAP."
  - "Много одновременных подключений с одного IP приводят к временной блокировке
     адреса, а не учётной записи."

imapsync_args: []
