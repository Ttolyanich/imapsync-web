id: zimbra
name: Zimbra
icon: zimbra.svg
verified: false

roles: [source, destination]

host: ""
port: 993
security: ssl
verify_cert: true

# Ради чего Zimbra здесь и стоит: она умеет мастер-доступ. Один админский
# пароль вместо двухсот пользовательских — это снимает всю организационную
# часть переезда.
auth_mode: master

max_parallel: 5

folders:
  inbox: INBOX
  sent: Sent
  drafts: Drafts
  trash: Trash
  junk: Junk
  archive: Archive

hints:
  - "Поддерживает проксирующий логин вида «ящик*администратор» — тогда пароли
     пользователей не нужны вовсе. Учётную запись администратора и её пароль
     задай в полях мастер-доступа, разделитель оставь «*»."
  - "Если мастер-доступ не настроен на сервере, переключи режим на «пароль
     на каждый ящик»."
  - "Адрес сервера у каждой установки свой — заполни вручную."
  - "В локальных установках часто самоподписанный сертификат: если подключение
     падает с ошибкой TLS, сними галку проверки сертификата осознанно."

imapsync_args: []
