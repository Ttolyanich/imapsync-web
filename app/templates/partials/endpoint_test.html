<div class="notice {{ 'ok' if ok else 'err' }} small" style="margin-top:var(--space-2)">
  <b>{{ message }}</b>
  {% if hint %}<div class="muted" style="margin-top:4px">{{ hint }}</div>{% endif %}
  {% if capabilities %}
    <div class="muted" style="margin-top:4px">
      Возможности сервера:
      <code>{{ capabilities | join(', ') }}</code>
    </div>
  {% endif %}
</div>
