{% extends "base.html" %}
{% block title %}Ошибка {{ code }}{% endblock %}

{% macro body() %}
<div class="card error-card">
  <h1>{{ code }}</h1>
  <p style="font-size:16px;color:var(--ink);margin-bottom:var(--space-4)">{{ message }}</p>
  <a class="button primary" href="{{ url_for('projects.index') }}">Вернуться к проектам</a>
</div>
{% endmacro %}

{% block content %}{{ body() }}{% endblock %}
{% block anon %}<div class="login-page">{{ body() }}</div>{% endblock %}
