{% extends "base.html" %}
{% block title %}Вход — imapsync-web{% endblock %}

{% block anon %}
<div class="login-page">
  <form class="card login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <div class="brand">
      <span class="brand-mark">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
      </span>
      <span>imapsync-web</span>
    </div>
    
    <p class="muted" style="text-align:center;margin-bottom:var(--space-5)">Панель миграции почтовых ящиков</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, text in messages %}
        <div class="flash flash-{{ category }}">{{ text }}</div>
      {% endfor %}
    {% endwith %}

    <label>Логин
      <input name="username" value="{{ username }}" autocomplete="username" autofocus required placeholder="Пользователь">
    </label>
    <label style="margin-top:var(--space-3)">Пароль
      <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
    </label>
    
    <button class="primary" type="submit" style="margin-top:var(--space-5)">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
      Войти в панель
    </button>
  </form>
</div>
{% endblock %}
