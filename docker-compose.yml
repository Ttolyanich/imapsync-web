services:
  imapsync-web:
    build: .
    # Или готовый образ:
    # image: ghcr.io/OWNER/imapsync-web:latest
    container_name: imapsync-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Панель хранит действующие пароли от почтовых ящиков.
      # Не выставляй её в интернет — только локальная сеть, VPN или
      # реверс-прокси с собственной аутентификацией.
      - "127.0.0.1:8090:8000"
    volumes:
      # БД, кэш imapsync (нужен постоянный — иначе каждый повторный прогон
      # заново вычитывает заголовки всего ящика), логи, черновики импорта.
      - ./data:/data
